<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <style>
      .title{font:700 32px 'Malgun Gothic',Arial;fill:#17324f}
      .sub{font:500 17px 'Malgun Gothic',Arial;fill:#536b85}
      .h{font:700 22px 'Malgun Gothic',Arial;fill:#17324f}
      .t{font:600 17px 'Malgun Gothic',Arial;fill:#334155}
      .w{fill:#fff}.bg{fill:#eaf8fb}.panel{fill:#fff;stroke:#b7d0ea;stroke-width:2}
      .blue{fill:#1a54af}.soft{fill:#eef7ff;stroke:#8fb5dd;stroke-width:2}
      .soft2{fill:#f7fbff;stroke:#c5d8ed;stroke-width:2}.dark{fill:#1646a0}
      .line{stroke:#34495e;stroke-width:2.4;fill:none}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#34495e"/></marker>
  </defs>
  <rect width="1400" height="850" class="bg"/>
  <text x="70" y="70" class="title">MPS MES WPF Application Shell</text>
  <text x="72" y="104" class="sub">MainWindow is the permanent frame. Each tab swaps the working view.</text>

  <rect x="80" y="145" width="790" height="610" rx="18" class="panel"/>
  <rect x="115" y="185" width="720" height="70" rx="10" class="blue"/>
  <text x="145" y="228" class="h" fill="#fff">Header: logo, title, current time</text>
  <rect x="115" y="290" width="215" height="410" rx="12" class="dark"/>
  <text x="150" y="330" class="h" fill="#fff">Sidebar</text>
  <rect x="145" y="360" width="155" height="44" rx="7" class="w"/><text x="177" y="388" class="t">PLC status</text>
  <rect x="145" y="425" width="155" height="44" rx="7" class="w"/><text x="178" y="453" class="t">Run mode</text>
  <rect x="145" y="490" width="155" height="44" rx="7" class="w"/><text x="167" y="518" class="t">Production</text>
  <rect x="145" y="555" width="155" height="44" rx="7" class="w"/><text x="182" y="583" class="t">Vision</text>

  <rect x="365" y="290" width="470" height="410" rx="12" class="soft"/>
  <text x="395" y="330" class="h">TabControl content area</text>
  <rect x="400" y="365" width="180" height="48" rx="8" class="soft2"/><text x="438" y="395" class="t">MonitorView</text>
  <rect x="620" y="365" width="180" height="48" rx="8" class="soft2"/><text x="640" y="395" class="t">VisionView</text>
  <rect x="400" y="435" width="180" height="48" rx="8" class="soft2"/><text x="421" y="465" class="t">ManualView</text>
  <rect x="620" y="435" width="180" height="48" rx="8" class="soft2"/><text x="645" y="465" class="t">QualityView</text>
  <rect x="400" y="505" width="180" height="48" rx="8" class="soft2"/><text x="419" y="535" class="t">StatusView</text>
  <rect x="620" y="505" width="180" height="48" rx="8" class="soft2"/><text x="653" y="535" class="t">DbSearch</text>
  <rect x="400" y="575" width="180" height="48" rx="8" class="soft2"/><text x="423" y="605" class="t">HistoryView</text>
  <rect x="620" y="575" width="180" height="48" rx="8" class="soft2"/><text x="654" y="605" class="t">EventLog</text>

  <rect x="940" y="165" width="360" height="560" rx="18" class="panel"/>
  <text x="980" y="210" class="h">Binding model</text>
  <rect x="1015" y="250" width="210" height="54" rx="9" class="soft"/><text x="1051" y="284" class="t">MainViewModel</text>
  <line x1="1120" y1="304" x2="1120" y2="355" class="line" marker-end="url(#arr)"/>
  <rect x="980" y="355" width="280" height="285" rx="12" class="soft2"/>
  <text x="1010" y="395" class="t">MonitorVm</text>
  <text x="1010" y="430" class="t">VisionInspectionVm</text>
  <text x="1010" y="465" class="t">ManualControlVm</text>
  <text x="1010" y="500" class="t">QualityAnalysisVm</text>
  <text x="1010" y="535" class="t">ProductionStatusVm</text>
  <text x="1010" y="570" class="t">DbSearchVm</text>
  <text x="1010" y="605" class="t">HistoryVm / EventLogVm</text>
  <line x1="870" y1="495" x2="940" y2="495" class="line" marker-end="url(#arr)"/>
  <text x="70" y="810" class="sub">Figure 1. Permanent shell, tab views, and the MainViewModel binding surface.</text>
</svg>
